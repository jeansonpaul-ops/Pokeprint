<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKÉ-LABEL — DYMO Game Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/dymosoftware/dymo-connect-framework@master/dymo.connect.framework.js"></script>
<style>
  :root{
    --gb-darkest:#0f380f; --gb-dark:#306230; --gb-light:#8bac0f; --gb-lightest:#9bbc0f;
    --shell:#c4c0b8; --shell-dark:#a8a49c; --btn-a:#a93671; --ink:#1a1a1a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Press Start 2P', monospace;
    background:var(--gb-darkest);
    background-image:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.08) 2px 4px);
    color:var(--gb-lightest);
    min-height:100vh; padding:16px;
    image-rendering:pixelated;
  }
  .shell{max-width:980px; margin:0 auto;}
  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    border:4px solid var(--gb-light); padding:14px 16px; margin-bottom:14px;
    background:var(--gb-darkest);
  }
  h1{font-size:16px; letter-spacing:1px;}
  h1 small{display:block; font-size:8px; color:var(--gb-light); margin-top:6px;}
  .dymo-status{font-size:8px; padding:8px 10px; border:2px solid var(--gb-light); line-height:1.6;}
  .dymo-status.ok{color:var(--gb-lightest);}
  .dymo-status.ko{color:#e8a0a0; border-color:#e8a0a0;}

  .panel{
    display:grid; grid-template-columns: 1fr 340px; gap:14px; margin-bottom:14px;
  }
  @media(max-width:820px){ .panel{grid-template-columns:1fr;} }

  /* Écran Game Boy = aperçu étiquette */
  .screen-frame{
    background:var(--shell); border-radius:8px 8px 28px 8px; padding:18px 18px 12px;
    box-shadow:inset 0 0 0 3px var(--shell-dark);
  }
  .screen-label{font-size:7px; color:#555; text-align:center; margin-bottom:8px; font-family:'Press Start 2P';}
  .screen{
    background:var(--gb-lightest); border:6px solid #3a3a3a; border-radius:4px;
    display:flex; align-items:center; justify-content:center; min-height:220px; padding:10px;
  }
  #previewCanvas{max-width:100%; height:auto; image-rendering:pixelated; box-shadow:0 0 0 2px var(--gb-darkest);}
  .screen .empty{color:var(--gb-darkest); font-size:9px; text-align:center; line-height:2;}
  .batt{display:flex; gap:6px; align-items:center; margin-top:8px; font-size:6px; color:#555;}
  .batt .led{width:8px; height:8px; border-radius:50%; background:#666;}
  .batt .led.on{background:#c0392b; box-shadow:0 0 6px #c0392b;}

  /* Contrôles */
  .controls{
    border:4px solid var(--gb-light); padding:14px; display:flex; flex-direction:column; gap:12px;
    font-size:8px;
  }
  .controls label{display:block; margin-bottom:5px; color:var(--gb-light);}
  select,input[type=number],input[type=search]{
    width:100%; font-family:'Press Start 2P'; font-size:8px; padding:8px;
    background:var(--gb-darkest); color:var(--gb-lightest); border:2px solid var(--gb-light);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .toggle{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .toggle input{accent-color:var(--gb-light); width:14px; height:14px;}
  button{
    font-family:'Press Start 2P'; font-size:9px; padding:12px; cursor:pointer;
    border:none; color:#fff; letter-spacing:1px;
  }
  button:active{transform:translateY(2px);}
  .btn-print{background:var(--btn-a); box-shadow:0 4px 0 #6e2049;}
  .btn-print:disabled{background:#555; box-shadow:0 4px 0 #333; cursor:not-allowed;}
  .btn-dl{background:var(--gb-dark); box-shadow:0 4px 0 var(--gb-darkest); font-size:8px; padding:10px;}

  /* Grille Pokémon */
  .searchbar{margin-bottom:12px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;
  }
  .poke{
    background:#f0efe4; border:3px solid var(--gb-dark); cursor:pointer;
    padding:6px 4px; text-align:center; transition:transform .05s;
  }
  .poke:hover{border-color:var(--btn-a); transform:translateY(-2px);}
  .poke:active{transform:translateY(1px);}
  .poke img{width:64px; height:64px; image-rendering:pixelated;}
  .poke .num{font-size:6px; color:var(--gb-dark); display:block;}
  .poke .nm{font-size:6px; color:var(--gb-darkest); display:block; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* Toast */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(120px);
    background:var(--gb-darkest); border:3px solid var(--gb-lightest); color:var(--gb-lightest);
    padding:12px 18px; font-size:8px; transition:transform .2s; z-index:99; max-width:90vw; line-height:1.7;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>POKÉ-LABEL<small>Impression DYMO · sprites Game Boy Gén.1</small></h1>
    <div id="dymoStatus" class="dymo-status ko">DYMO : recherche...</div>
  </header>

  <div class="panel">
    <div class="screen-frame">
      <div class="screen-label">DOT MATRIX WITH STEREO SOUND</div>
      <div class="screen">
        <div class="empty" id="emptyMsg">CHOISIS UN<br>POKÉMON<br>▼</div>
        <canvas id="previewCanvas" style="display:none"></canvas>
      </div>
      <div class="batt"><span class="led" id="led"></span> BATTERY</div>
    </div>

    <div class="controls">
      <div>
        <label>IMPRIMANTE</label>
        <select id="printerSel"><option>Aucune détectée</option></select>
      </div>
      <div>
        <label>FORMAT ÉTIQUETTE</label>
        <select id="formatSel">
          <option value="11354">11354 · 57 × 32 mm</option>
          <option value="99012">99012 · 89 × 36 mm</option>
          <option value="99010">99010 · 89 × 28 mm (adresse)</option>
          <option value="99015">99015 · 70 × 54 mm</option>
        </select>
      </div>
      <div class="row2">
        <div>
          <label>COPIES</label>
          <input type="number" id="copies" value="1" min="1" max="20">
        </div>
        <div>
          <label>SEUIL GRIS</label>
          <input type="number" id="threshold" value="200" min="50" max="250" step="10">
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="directPrint" checked>
        <span>IMPRESSION DIRECTE AU CLIC</span>
      </label>
      <button class="btn-print" id="btnPrint" disabled>▶ IMPRIMER</button>
      <button class="btn-dl" id="btnDl" disabled>TÉLÉCHARGER PNG</button>
    </div>
  </div>

  <div class="searchbar">
    <input type="search" id="search" placeholder="RECHERCHER... (nom ou n°)">
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="toast"></div>

const SPRITE = n => "data:image/png;base64," + _BW[n-1];
const SPRITE_UI = n => "data:image/png;base64," + _UI[n-1];

// ------- Formats (mm) → 300 dpi + twips -------
const FORMATS = {
  "11354": {w:57, h:32, paper:"11354 Multipurpose"},
  "99012": {w:89, h:36, paper:"99012 Large Address"},
  "99010": {w:89, h:28, paper:"99010 Standard Address"},
  "99015": {w:70, h:54, paper:"99015 Diskette"}
};
const mm2px = mm => Math.round(mm/25.4*300);
const mm2tw = mm => Math.round(mm*56.6929);

// ------- État -------
let current = null; // {num, name}
let printers = [];

// ------- UI refs -------
const $ = id => document.getElementById(id);
const canvas = $("previewCanvas"), ctx = canvas.getContext("2d");

function toast(msg, ms=2600){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms);
}

// ------- Grille -------
function buildGrid(filter=""){
  const g = $("grid"); g.innerHTML = "";
  const f = filter.trim().toLowerCase();
  NAMES.forEach((name, i)=>{
    const num = i+1;
    if(f && !name.toLowerCase().includes(f) && !String(num).includes(f)) return;
    const d = document.createElement("div");
    d.className = "poke";
    d.innerHTML = `<span class="num">#${String(num).padStart(3,"0")}</span>
      <img loading="lazy" src="${SPRITE_UI(num)}" alt="${name}">
      <span class="nm">${name.toUpperCase()}</span>`;
    d.onclick = ()=> selectPokemon(num, name);
    g.appendChild(d);
  });
}
$("search").addEventListener("input", e=>buildGrid(e.target.value));

// ------- Rendu étiquette -------
function loadSprite(num){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error("Sprite illisible"));
    img.src = SPRITE(num);
  });
}

function spriteToBW(img, lightThresh){
  const c = document.createElement("canvas");
  const W = img.naturalWidth, H = img.naturalHeight;
  c.width = W; c.height = H;
  const cx = c.getContext("2d");
  cx.drawImage(img, 0, 0);
  const d = cx.getImageData(0,0,W,H);
  const p = d.data;
  // 3 niveaux : sombre = noir plein, gris moyen = damier, clair = blanc.
  // Le damier préserve les zones claires (flammes, ventres) qu'un seuil binaire efface.
  const DARK = 110;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    const a=p[i+3], lum=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
    let black=false;
    if(a>120){
      if(lum < DARK) black = true;
      else if(lum < lightThresh) black = ((x+y)&1)===0;
    }
    p[i]=p[i+1]=p[i+2]= black?0:255;
    p[i+3]=255;
  }
  cx.putImageData(d,0,0);
  return cropToContent(c);
}

// Recadre sur les pixels noirs : supprime les marges vides du sprite 96x96
function cropToContent(c){
  const cx = c.getContext("2d");
  const d = cx.getImageData(0,0,c.width,c.height).data;
  let x0=c.width, y0=c.height, x1=0, y1=0;
  for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++){
    if(d[(y*c.width+x)*4] === 0){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  if(x1<x0) return c; // sprite vide, ne devrait pas arriver
  const w=x1-x0+1, h=y1-y0+1;
  const out = document.createElement("canvas");
  out.width=w; out.height=h;
  out.getContext("2d").drawImage(c, x0, y0, w, h, 0, 0, w, h);
  return out;
}

async function renderLabel(num, name){
  const fmt = FORMATS[$("formatSel").value];
  const W = mm2px(fmt.w), H = mm2px(fmt.h);
  canvas.width = W; canvas.height = H;
  

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);

  const img = await loadSprite(num);
  const bw = spriteToBW(img, +$("threshold").value || 200);

  // Sprite seul, centré, taille maximale (multiples entiers)
  const m = Math.round(H*0.03);
  const scale = Math.max(1, Math.floor(Math.min((W-2*m)/bw.width, (H-2*m)/bw.height)));
  const sw = bw.width*scale, sh = bw.height*scale;
  ctx.drawImage(bw, Math.round((W-sw)/2), Math.round((H-sh)/2), sw, sh);

  canvas.style.display = "block";
  $("emptyMsg").style.display = "none";
}

// ------- Sélection -------
async function selectPokemon(num, name){
  current = {num, name};
  try{
    await renderLabel(num, name);
    $("btnPrint").disabled = printers.length===0;
    $("btnDl").disabled = false;
    if($("directPrint").checked && printers.length>0){
      printLabel();
    } else if($("directPrint").checked){
      toast("DYMO non détectée — aperçu seulement");
    }
  }catch(e){
    toast("Erreur : "+e.message);
  }
}

// ------- DYMO -------
function labelXml(base64){
  const fmt = FORMATS[$("formatSel").value];
  const long = mm2tw(fmt.w), short = mm2tw(fmt.h), m = 100;
  return `<?xml version="1.0" encoding="utf-8"?>
<DieCutLabel Version="8.0" Units="twips">
  <PaperOrientation>Landscape</PaperOrientation>
  <Id>PokeLabel</Id>
  <PaperName>${fmt.paper}</PaperName>
  <DrawCommands>
    <RoundRectangle X="0" Y="0" Width="${short}" Height="${long}" Rx="180" Ry="180"/>
  </DrawCommands>
  <ObjectInfo>
    <ImageObject>
      <Name>GRAPHIC</Name>
      <ForeColor Alpha="255" Red="0" Green="0" Blue="0"/>
      <BackColor Alpha="0" Red="255" Green="255" Blue="255"/>
      <LinkedObjectName></LinkedObjectName>
      <Rotation>Rotation0</Rotation>
      <IsMirrored>False</IsMirrored>
      <IsVariable>False</IsVariable>
      <Image>${base64}</Image>
      <ScaleMode>Uniform</ScaleMode>
      <BorderWidth>0</BorderWidth>
      <BorderColor Alpha="255" Red="0" Green="0" Blue="0"/>
      <HorizontalAlignment>Center</HorizontalAlignment>
      <VerticalAlignment>Center</VerticalAlignment>
    </ImageObject>
    <Bounds X="${m}" Y="${m}" Width="${long-2*m}" Height="${short-2*m}"/>
  </ObjectInfo>
</DieCutLabel>`;
}

function printLabel(){
  if(!current){ toast("Aucun Pokémon sélectionné"); return; }
  if(printers.length===0){ toast("Aucune imprimante DYMO"); return; }
  try{
    const b64 = canvas.toDataURL("image/png").split(",")[1];
    const label = dymo.label.framework.openLabelXml(labelXml(b64));
    const printer = $("printerSel").value;
    const copies = Math.max(1, +$("copies").value || 1);
    const params = dymo.label.framework.createLabelWriterPrintParamsXml({copies});
    label.print(printer, params);
    const led = $("led"); led.classList.add("on");
    setTimeout(()=>led.classList.remove("on"), 1500);
    toast(`▶ ${current.name.toUpperCase()} ×${copies} envoyé à ${printer}`);
  }catch(e){
    toast("Erreur impression : "+(e.message||e), 4000);
  }
}
$("btnPrint").onclick = printLabel;

$("btnDl").onclick = ()=>{
  if(!current) return;
  const a = document.createElement("a");
  a.download = `pokelabel-${String(current.num).padStart(3,"0")}-${current.name}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
};

// Re-rendu si format/seuil change
$("formatSel").onchange = $("threshold").onchange = ()=>{
  if(current) renderLabel(current.num, current.name);
};

// ------- Init DYMO -------
function initDymo(){
  const st = $("dymoStatus");
  try{
    dymo.label.framework.init(()=>{
      try{
        const env = dymo.label.framework.checkEnvironment();
        if(!env.isBrowserSupported || !env.isFrameworkInstalled){
          st.textContent = "DYMO Connect absent"; st.className = "dymo-status ko";
          return;
        }
        printers = (dymo.label.framework.getPrinters()||[]).filter(p=>p.printerType==="LabelWriterPrinter");
        const sel = $("printerSel"); sel.innerHTML = "";
        if(printers.length===0){
          sel.innerHTML = "<option>Aucune détectée</option>";
          st.textContent = "DYMO : pas d'imprimante"; st.className = "dymo-status ko";
        }else{
          printers.forEach(p=>{
            const o = document.createElement("option");
            o.value = p.name; o.textContent = p.name + (p.isConnected?"":" (hors ligne)");
            sel.appendChild(o);
          });
          st.textContent = "DYMO OK · "+printers.length+" imprimante(s)";
          st.className = "dymo-status ok";
          if(current) $("btnPrint").disabled = false;
        }
      }catch(e){
        st.textContent = "DYMO : erreur ("+(e.message||e)+")"; st.className = "dymo-status ko";
      }
    });
  }catch(e){
    st.textContent = "Framework DYMO non chargé"; st.className = "dymo-status ko";
  }
}

buildGrid();
window.addEventListener("load", ()=>setTimeout(initDymo, 300));
</script>
